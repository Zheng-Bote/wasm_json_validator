[package]
name = "wasm_json_validator"
version = "0.1.0"
edition = "2024"
description = "Fast JSON-Schema payload validator for WASM/WASI and Spin supporting JSON, CSV, and XLSX inputs"
license = "Apache-2.0"

[workspace]
members = [
    ".",
    "spin",
]

[dependencies]
jsonschema = { version = "0.29.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
calamine = "0.38"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
wit-bindgen = { version = "0.40.0", optional = true }

[features]
default = []
wit = ["dep:wit-bindgen"]
